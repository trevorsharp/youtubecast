# Canonical YouTubeCast nginx configuration.
#
# One template serves every consumer:
#   * the Nix package ships it as `$out/app/nginx.conf` and `start.sh` fills in
#     the placeholders at startup (also what the Docker image does)
#   * the NixOS module substitutes the placeholders at evaluation time and
#     installs the finished file to /etc/youtubecast/nginx.conf
#
# The four placeholders are named port, bindAddress, configBase and runtimeDir,
# each spelled with a dollar sign and braces below (they must be, so that sed
# can find them). They are:
#   port         external port nginx listens on
#   bindAddress  interface nginx binds to
#   configBase   directory that contains the `content` folder (see src/env.ts)
#   runtimeDir   writable directory for the pid file and logs
#
# Everything else starting with a bare dollar sign ($request_uri, $host, ...)
# is nginx's own variable and is deliberately left alone.
worker_processes auto;
error_log ${runtimeDir}/nginx-error.log warn;
pid ${runtimeDir}/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log ${runtimeDir}/nginx-access.log;

  # MIME types are inlined so the template does not depend on where nginx config
  # ships them (/etc/nginx/mime.types on the Docker image vs the nix store on
  # NixOS). HLS artefacts (.m3u8/.ts) need a real type or strict clients balk.
  types {
    application/dash+xml mpd;
    application/javascript mjs;
    application/json json;
    application/manifest+json webmanifest;
    application/pdf pdf;
    application/pgp-signature sig;
    application/rtf rtf;
    application/vnd.apple.mpegurl m3u8;
    application/wasm wasm;
    application/x-bzip2 bz2;
    application/x-tar tar;
    application/xml atom xml;
    application/rss+xml rss;
    application/zip zip;
    audio/aac aac;
    audio/mpeg mp3;
    audio/mp4 m4a;
    audio/ogg ogg opus;
    audio/wav wav;
    audio/webm weba;
    font/otf otf;
    font/ttf ttf;
    font/woff woff;
    font/woff2 woff2;
    image/avif avif;
    image/bmp bmp;
    image/gif gif;
    image/jpeg jpeg jpg;
    image/png png;
    image/svg+xml svg svgz;
    image/tiff tif tiff;
    image/vnd.microsoft.icon ico;
    image/webp webp;
    text/cache-manifest appcache;
    text/css css;
    text/csv csv;
    text/html htm html shtml;
    text/javascript js;
    text/markdown md;
    text/plain sh txt;
    text/x-python py;
    video/mp2t ts;
    video/mp4 m4v mp4;
    video/ogg ogv;
    video/webm webm;
  }

  # --- Proxy ---------------------------------------------------------------
  proxy_http_version 1.1;
  proxy_cache_bypass $http_upgrade;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen ${bindAddress}:${port};

    # Downloaded HLS/MP4 enclosures. The configBase placeholder (set above) is
    # the parent of the app's content folder — the NixOS module points it at
    # <contentDir>/runtime, the Docker image at /app.
    location /content/ {
      root ${configBase};
    }

    location / {
      proxy_pass http://127.0.0.1:3001$request_uri;
    }
  }
}
